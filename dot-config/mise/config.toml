# Global tool versions. Per-project mise.toml files override these tool by tool;
# anything a project does not name falls through to here.
#
# Versions float on "latest": a fresh box gets whatever shipped that day. Lockfiles
# are a project-config feature — mise refuses to lock the global config — so pin a
# tool here the day its drift bites.

[tools]
neovim = "latest"
node = "latest"
fd = "latest"
ripgrep = "latest"
tree-sitter = "latest"
python = "latest"
sops = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"

# herdr plugin dependencies: the worktrunk plugin shells out to `wt` and `fzf`,
# `jq` and `git` come from the system packages.
fzf = "latest"
"github:max-sixty/worktrunk" = { version = "latest", exe = "wt" }
"github:rtk-ai/rtk" = { version = "latest", exe = "rtk" }

# herdr publishes Linux release assets only; macOS gets it from Homebrew.
"github:ogulcancelik/herdr" = { version = "latest", os = ["linux"] }

[settings]
experimental = true    # required by the github and npm backends
