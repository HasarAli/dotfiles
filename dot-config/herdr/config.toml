onboarding = false
# herdr configuration — managed via dotfiles (stow)

[theme]
name = "catppuccin"

auto_switch = false
[keys]
# Ctrl+Space prefix (matching tmux muscle memory)
prefix = "ctrl+space"

# Splits: hybrid - / \ (tmux fallback)
# split_horizontal = "prefix+-" is herdr default; omitted
split_vertical = "prefix+\\"

# Tab navigation: h/l matches tmux window prev/next
previous_tab = "prefix+h"
next_tab = "prefix+l"

# Workspace navigation: j/k
previous_workspace = "prefix+j"
next_workspace = "prefix+k"

# close_tab = "prefix+shift+x" is herdr default; omitted

# Agent focus: 1..9 (overrides default switch_tab since tabs use h/l)
focus_agent = "prefix+1..9"
switch_tab = ""

# Detach: d (tmux style)
detach = "prefix+d"

# Disable focus_pane defaults — Ctrl+hjkl (vim-herdr-navigation) handles pane nav
focus_pane_left = ""
focus_pane_down = ""
focus_pane_up = ""
focus_pane_right = ""

# ── Plugin: herdr-splits.nvim ──
# Seamless Ctrl+hjkl nav + Alt+hjkl resize between Neovim splits & Herdr panes.
# Install: herdr plugin install lmilojevicc/herdr-splits.nvim
# Editor side: lua/plugins/navigation.lua

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-splits.nav-left"
description = "Navigate left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-splits.nav-down"
description = "Navigate down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-splits.nav-up"
description = "Navigate up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-splits.nav-right"
description = "Navigate right"

[[keys.command]]
key = "alt+h"
type = "plugin_action"
command = "herdr-splits.resize-left"
description = "Resize left"

[[keys.command]]
key = "alt+j"
type = "plugin_action"
command = "herdr-splits.resize-down"
description = "Resize down"

[[keys.command]]
key = "alt+k"
type = "plugin_action"
command = "herdr-splits.resize-up"
description = "Resize up"

[[keys.command]]
key = "alt+l"
type = "plugin_action"
command = "herdr-splits.resize-right"
description = "Resize right"

# ── Plugin: worktrunk ──
# Overrides herdr's built-in "new worktree" (prefix+shift+g) with
# worktrunk's switch/create picker with hooks.
# Install: herdr plugin install devashish2203/herdr-worktrunk --yes

[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "worktrunk.open"
description = "Worktree: switch / create from default branch"

[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "worktrunk.open-current"
description = "Worktree: switch / create from current branch"

[[keys.command]]
key = "prefix+shift+d"
type = "plugin_action"
command = "worktrunk.remove"
description = "Worktree: remove"

[ui]
pane_borders = true
pane_gaps = true

[ui.toast]
delivery = "system"

[experimental]
switch_ascii_input_source_in_prefix = false
