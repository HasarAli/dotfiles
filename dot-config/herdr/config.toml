onboarding = false

[theme]
name = "catppuccin"

auto_switch = false  # Follow host terminal light/dark → switches theme; off = manual only

[keys]
prefix = "ctrl+space"

split_vertical = "prefix+\\"

previous_tab = ["prefix+h", "shift+left"]
next_tab = ["prefix+l", "shift+right"]

previous_workspace = ["prefix+k", "shift+up"]
next_workspace = ["prefix+j", "shift+down"]

previous_agent = "ctrl+up"
next_agent = "ctrl+down"

switch_tab = "prefix+1..9"
focus_agent = ""
switch_workspace = ""
navigate_workspace_up = ""
navigate_workspace_down = ""
cycle_pane_next = ""
cycle_pane_previous = ""
workspace_picker = ""

new_workspace = "prefix+w"
close_workspace = "prefix+q"
new_tab = "prefix+t"

# Detach: d (tmux style)
detach = "prefix+d"

# Disable focus_pane defaults — Ctrl+hjkl (herdr-splits.nvim) handles pane nav
focus_pane_left = ""
focus_pane_down = ""
focus_pane_up = ""
focus_pane_right = ""
resize_mode = ""  # unset — prefix+r used for worktree remove

# ── Plugin: herdr-splits.nvim ──
# Seamless Ctrl+hjkl nav + Alt+hjkl resize between Neovim splits & Herdr panes.
# Install: herdr plugin install lmilojevicc/herdr-splits.nvim
# Editor side: lua/plugins/navigation.lua

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-splits.nav-left"
description = "Pane focus: left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-splits.nav-down"
description = "Pane focus: down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-splits.nav-up"
description = "Pane focus: up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-splits.nav-right"
description = "Pane focus: right"

[[keys.command]]
key = "alt+h"
type = "plugin_action"
command = "herdr-splits.resize-left"
description = "Resize left"

[[keys.command]]
key = "alt+j"
type = "plugin_action"
command = "herdr-splits.resize-down"
description = "Resize down"

[[keys.command]]
key = "alt+k"
type = "plugin_action"
command = "herdr-splits.resize-up"
description = "Resize up"

[[keys.command]]
key = "alt+l"
type = "plugin_action"
command = "herdr-splits.resize-right"
description = "Resize right"

# ── Plugin: worktrunk ──
# Overrides herdr's built-in "new worktree" (prefix+shift+g) with
# worktrunk's switch/create picker with hooks.
# Install: herdr plugin install devashish2203/herdr-worktrunk --yes

[[keys.command]]
key = "prefix+n"
type = "plugin_action"
command = "worktrunk.open"
description = "Worktree: switch or create from default branch"

[[keys.command]]
key = "prefix+shift+n"
type = "plugin_action"
command = "worktrunk.open-current"
description = "Worktree: switch or create from current branch"

[[keys.command]]
key = "prefix+r"
type = "plugin_action"
command = "worktrunk.remove"
description = "Worktree: delete managed checkout"

[ui]
pane_borders = true
pane_gaps = true

[ui.toast]
delivery = "herdr"

[experimental]
switch_ascii_input_source_in_prefix = false
